<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/booking.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Booking</title>
</head>
<body>
    
    <form name="booking" class="booking" id="booking-form">
        <div class="back-square top-left"></div>
        <div class="back-square bottom-right"></div>
        <h3>Book a car rental</h3>

        <div class="name-inputs">
            <div>
                <label>Forename<i class="fa-regular fa-address-card"></i></label>
                <input type="text" name="forename" for="forename" id="forename" placeholder="Forename">
                <span class="error-message" id="forename-error"></span>
            </div>

            <div>
                <label>Surname<i class="fa-regular fa-address-card"></i></label>
                <input type="text" name="surname" for="surname" id="surname" placeholder="Surname">
                <span class="error-message" id="surname-error"></span>
            </div>
        </div>

        <label>Email<i class="fa-regular fa-envelope"></i></label>
        <input type="email" name="email" for="email" id="email" placeholder="Email">
        <span class="error-message" id="email-error"></span>

        <label>Phone Number<i class="fa-solid fa-phone"></i></label>
        <input type="tel" name="phone" for="phone" id="phone" placeholder="Phone Number">
        <span class="error-message" id="phone-error"></span>

        <label>Date of Pickup<i class="fa-regular fa-calendar"></i></label>
        <input type="date" name="start-date" for="start-date" id="start-date">
        
        <label>Date of Return<i class="fa-regular fa-calendar"></i></label>
        <input type="date" name="end-date" for="end-date" id="end-date">
        <label id=duration></label>
        <button type="submit">Confirm</button>
    </form>

    <script src="../js/booking.js"></script>

</body>
</html>
